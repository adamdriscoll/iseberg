name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64
          - os: macos-latest
            runtime: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install matching PowerShell for tests
        shell: pwsh
        run: ./build/Install-TestPowerShell.ps1 -Runtime '${{ matrix.runtime }}'
      - run: dotnet test Iseberg.slnx -c Release --verbosity minimal --logger trx --results-directory TestResults --blame-hang-timeout 3m --blame-hang-dump-type none
      - name: Verify editor package-only consumers
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/Test-EditorPackage.ps1
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: ignore
      - run: dotnet publish src/Iseberg -c Release --no-restore -o publish
  package:
    needs: test
    uses: ./.github/workflows/package.yml
    with:
      version: 0.0.${{ github.run_number }}-ci
