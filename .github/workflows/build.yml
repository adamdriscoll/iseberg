name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64
          - os: macos-latest
            runtime: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install matching PowerShell for tests
        shell: pwsh
        run: ./build/Install-TestPowerShell.ps1 -Runtime '${{ matrix.runtime }}'
      - run: dotnet test Iseberg.slnx -c Release --verbosity minimal
      - run: dotnet publish src/Iseberg -c Release --no-restore -o publish

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64
          - os: ubuntu-24.04-arm
            runtime: linux-arm64
          - os: macos-15-intel
            runtime: osx-x64
          - os: macos-latest
            runtime: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install matching PowerShell for compact runtime checks
        shell: pwsh
        run: ./build/Install-TestPowerShell.ps1 -Runtime '${{ matrix.runtime }}'
      - name: Publish, check and package both distributions
        shell: pwsh
        run: ./build/Publish.ps1 -Runtime '${{ matrix.runtime }}'
      - uses: actions/upload-artifact@v4
        with:
          name: Iseberg-${{ matrix.runtime }}
          path: publish/*.zip
          if-no-files-found: error
