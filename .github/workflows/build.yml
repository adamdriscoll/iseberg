name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Iseberg.slnx -c Release --verbosity minimal --logger trx --results-directory TestResults --blame-hang-timeout 3m --blame-hang-dump-type none
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: ignore
      - run: dotnet publish src/Iseberg -c Release --no-restore -o publish
  package:
    needs: test
    uses: ./.github/workflows/package.yml
    with:
      version: 0.0.${{ github.run_number }}-ci
