name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Iseberg.slnx -c Release --verbosity minimal
      - run: dotnet publish src/Iseberg -c Release --no-restore -o publish
  package:
    needs: test
    uses: ./.github/workflows/package.yml
    with:
      version: 0.0.${{ github.run_number }}-ci
