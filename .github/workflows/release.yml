name: Release packages

on:
  push:
    tags: ['v*', '[0-9]*']
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Validate release tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -creplace '^v', ''
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$') {
            throw "Release tags must be versions such as v1.2.3 or v1.2.3-preview.1."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Iseberg.slnx -c Release --verbosity minimal
  package:
    needs: [version, test]
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}
  upload:
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Attach packages to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > releases.json
          if ! jq -e --arg tag "$RELEASE_TAG" 'any(.[][]; .tag_name == $tag)' releases.json > /dev/null; then
            args=()
            if [[ "$RELEASE_VERSION" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --title "Iseberg $RELEASE_VERSION" --generate-notes "${args[@]}"
          fi
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
  publish-nuget:
    needs: [version, upload]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: Iseberg-${{ needs.version.outputs.version }}-nuget
          path: nuget
      - name: Authenticate to nuget.org with OIDC
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish packages to nuget.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw "NuGet trusted-publishing login did not return a temporary API key."
          }
          foreach ($package in 'PoshTools.Iseberg.Core', 'PoshTools.Iseberg.Editor', 'PoshTools.ISEBerg') {
            dotnet nuget push "nuget/$package.$env:PACKAGE_VERSION.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Failed to publish $package to nuget.org." }
          }
