name: Package

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack NuGet libraries
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: dotnet pack Iseberg.slnx -c Release -p:Version=$env:PACKAGE_VERSION -p:ContinuousIntegrationBuild=true -o publish/nuget --verbosity minimal
      - uses: actions/upload-artifact@v4
        with:
          name: Iseberg-${{ inputs.version }}-nuget
          path: publish/nuget/*.nupkg
          if-no-files-found: error
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64
          - os: ubuntu-latest
            runtime: linux-arm64
          - os: macos-latest
            runtime: osx-x64
          - os: macos-latest
            runtime: osx-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build unsigned packages
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          PACKAGE_RUNTIME: ${{ matrix.runtime }}
        run: ./packaging/Package.ps1 -Runtime $env:PACKAGE_RUNTIME -Version $env:PACKAGE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: Iseberg-${{ inputs.version }}-${{ matrix.runtime }}
          path: |
            publish/artifacts/${{ matrix.runtime }}/*.zip
            publish/artifacts/${{ matrix.runtime }}/*.msi
            publish/artifacts/${{ matrix.runtime }}/*.dmg
          if-no-files-found: error
  compact-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64
          - os: ubuntu-24.04-arm
            runtime: linux-arm64
          - os: macos-15-intel
            runtime: osx-x64
          - os: macos-latest
            runtime: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install matching PowerShell for compact runtime checks
        shell: pwsh
        run: ./build/Install-TestPowerShell.ps1 -Runtime '${{ matrix.runtime }}'
      - name: Publish, check and package both distributions
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          PACKAGE_RUNTIME: ${{ matrix.runtime }}
        run: ./build/Publish.ps1 -Runtime $env:PACKAGE_RUNTIME -Version $env:PACKAGE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: Iseberg-${{ inputs.version }}-${{ matrix.runtime }}-compact
          path: publish/Iseberg-${{ inputs.version }}-${{ matrix.runtime }}-compact.zip
          if-no-files-found: error
